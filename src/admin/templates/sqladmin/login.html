{% extends "sqladmin/base.html" %}
{% block head_tail %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(1200px 600px at 10% -10%, #1d4ed8 0%, transparent 60%),
                     radial-gradient(900px 500px at 110% 110%, #0f766e 0%, transparent 55%), #0f172a; }
  .jg-login { width: 100%; max-width: 420px; border-radius: 1.2rem; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
  .jg-brand { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.02em; }
  .jg-brand::before { content: "◉"; color: #2563eb; margin-right: .45rem; }
  .jg-sub { color: #64748b; font-size: .85rem; }
  .btn-primary { background:#2563eb; border-color:#2563eb; }
</style>
{% endblock %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100 px-3">
  <form class="card jg-login" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="jg-brand">Jamg'arma</div>
        <div class="jg-sub">Панель управления платформой · только для Super Admin</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input name="username" type="text" class="form-control {% if error %}is-invalid{% endif %}" placeholder="admin" autofocus>
        {% if error %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input name="password" type="password" class="form-control {% if error %}is-invalid{% endif %}" placeholder="••••••••">
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
