{% extends "sqladmin_original/layout.html" %}

{% block head_tail %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tblr-font-sans-serif: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --tblr-primary: #2563eb;
    --tblr-primary-rgb: 37, 99, 235;
  }
  body { background: #f3f5f9; }
  .navbar-vertical.navbar-dark {
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    border-right: 0;
  }
  .navbar-vertical .navbar-brand h3 {
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: .4rem 0 .6rem;
    color: #fff;
  }
  .navbar-vertical .navbar-brand h3::before {
    content: "◉";
    color: #60a5fa;
    margin-right: .45rem;
  }
  .navbar-vertical .nav-link { border-radius: .5rem; margin: 1px .5rem; }
  .navbar-vertical .nav-link.active,
  .navbar-vertical .nav-link:hover { background: rgba(96,165,250,.16); }
  .navbar-vertical .dropdown-menu { background: transparent; border: 0; }
  .navbar-vertical .dropdown-item { color: rgba(255,255,255,.75); }
  .navbar-vertical .dropdown-item.active,
  .navbar-vertical .dropdown-item:hover { color: #fff; background: rgba(96,165,250,.16); border-radius: .5rem; }
  .card { border: 0; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -16px rgba(15,23,42,.25); border-radius: .9rem; }
  .page-title { font-weight: 700; letter-spacing: -0.01em; }
  .badge { font-weight: 600; letter-spacing: .01em; }
  .table thead th { text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; color: #64748b; }
  .btn-primary { background: #2563eb; border-color: #2563eb; }
  .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  .jg-stat { display:flex; align-items:center; gap: 1rem; }
  .jg-stat .jg-icon {
    width: 48px; height: 48px; border-radius: 14px; display:flex; align-items:center; justify-content:center;
    font-size: 1.2rem; color:#fff;
  }
  .jg-stat .jg-value { font-size: 1.6rem; font-weight: 700; line-height: 1; }
  .jg-stat .jg-label { color:#64748b; font-size:.8rem; margin-top:.25rem; }
  .jg-pipe { display:flex; flex-wrap:wrap; gap:.5rem; }
  .jg-pipe .jg-step {
    flex: 1 1 140px; background:#fff; border-radius:.75rem; padding:.85rem 1rem;
    border:1px solid #e5e9f0;
  }
  .jg-pipe .jg-step .jg-count { font-size:1.5rem; font-weight:700; }
  .jg-pipe .jg-step .jg-title { color:#64748b; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; }
  .jg-pipe .jg-step ul { list-style:none; padding:0; margin:.5rem 0 0; font-size:.8rem; color:#475569; }
  .jg-pipe .jg-step li { display:flex; justify-content:space-between; }
  .jg-env { font-size:.75rem; color:#64748b; }
  .jg-env code { background:#eef2ff; color:#3730a3; padding:.1rem .4rem; border-radius:.3rem; }
</style>
{% endblock %}
